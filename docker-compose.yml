name: kasbyab

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kasbyab
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: kasbyab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasbyab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: kasbyab
      DB_USERNAME: kasbyab
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMS_DRIVER: ${SMS_DRIVER:-log}
      SMS_FAKE_MODE: ${SMS_FAKE_MODE:-true}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
    volumes:
      - backend_storage:/var/www/html/storage/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    environment:
      DATABASE_URL: postgresql://kasbyab:${DB_PASSWORD:-postgres}@postgres:5432/kasbyab
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  backend_storage:
